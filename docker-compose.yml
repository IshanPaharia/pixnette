services:
  # 1. Local Redis Container
  redis:
    image: redis:7.4-alpine
    container_name: pixnette_redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:-pixnette_secure_pass}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-pixnette_secure_pass}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - redis_data:/data
    networks:
      - db-tier

  # 2. Backend Instance 1
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixnette_backend_1
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-pixnette_secure_pass}
      - BYPASS_SECRET=${BYPASS_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - web-tier
      - db-tier

  # 3. Backend Instance 2
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixnette_backend_2
    restart: always
    env_file:
      - .env
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-pixnette_secure_pass}
      - BYPASS_SECRET=${BYPASS_SECRET}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - web-tier
      - db-tier

  # 4. Nginx Load Balancer Container
  nginx:
    image: nginx:1.27-alpine
    container_name: pixnette_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - web-tier

volumes:
  redis_data:

networks:
  web-tier:
    driver: bridge
  db-tier:
    driver: bridge
