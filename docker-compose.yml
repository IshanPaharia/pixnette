services:
  # 1. Local Redis Container
  redis:
    image: redis:alpine
    container_name: pixnette_redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-pixnette_secure_pass}"
    volumes:
      - redis_data:/data
    networks:
      - db-tier

  # 2. Backend Instance 1
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixnette_backend_1
    restart: always
    env_file:
      - backend.env
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-pixnette_secure_pass}
    depends_on:
      - redis
    networks:
      - web-tier
      - db-tier

  # 3. Backend Instance 2
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixnette_backend_2
    restart: always
    env_file:
      - backend.env
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-pixnette_secure_pass}
    depends_on:
      - redis
    networks:
      - web-tier
      - db-tier

  # 4. Nginx Load Balancer Container
  nginx:
    image: nginx:alpine
    container_name: pixnette_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend1
      - backend2
    networks:
      - web-tier

volumes:
  redis_data:

networks:
  web-tier:
    driver: bridge
  db-tier:
    driver: bridge