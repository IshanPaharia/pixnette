services:
  # 1. Local Redis Container
  redis:
    image: redis:alpine
    container_name: pixnette_redis
    restart: always
    volumes:
      - redis_data:/data
    # Not exposed to the internet, only accessible by backends internally!

  # 2. Backend Instance 1
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixnette_backend_1
    restart: always
    env_file:
      - backend.env
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # 3. Backend Instance 2
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixnette_backend_2
    restart: always
    env_file:
      - backend.env
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  # 4. Nginx Load Balancer Container
  nginx:
    image: nginx:alpine
    container_name: pixnette_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2

volumes:
  redis_data:
