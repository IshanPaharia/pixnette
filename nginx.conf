events {
    worker_connections 1024;
}

http {
    # 1. Define API request rate limiting zone (10MB handles ~160k IPs, rate capped at 10 reqs/sec)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 2. Trusted Cloudflare IP ranges to retrieve real client IPs for rate-limiting
    # (Verified IPv4/IPv6 ranges as of May 2026)
    
    # IPv4 Ranges
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    
    # IPv6 Ranges
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header CF-Connecting-IP;

    upstream pixnette_backend {
        server backend1:3001;
        server backend2:3001;
    }

    # 3. HTTP Server Block: Redirect all port 80 traffic to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # 4. HTTPS Server Block: Terminate SSL and load balance requests
    server {
        listen 443 ssl;
        server_name _;

        # SSL Certificates (Cloudflare Origin Certs mounted from host's ./ssl directory)
        ssl_certificate /etc/nginx/ssl/origin.crt;
        ssl_certificate_key /etc/nginx/ssl/origin.key;

        # Recommended SSL Options
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Reverse Proxy for API Endpoints (with rate limiting applied)
        location /api/ {
            # Limit requests with a burst capability of 20, returning 503 if exceeded
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://pixnette_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse Proxy for WebSockets / Socket.io Connections
        location /socket.io/ {
            proxy_pass http://pixnette_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Healthcheck endpoint
        location /health {
            return 200 'OK\n';
            add_header Content-Type text/plain;
        }
    }
}