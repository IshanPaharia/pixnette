name: Deploy Pixnette

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Check backend syntax
        run: npm run check --prefix backend

      - name: Audit production dependencies
        continue-on-error: true
        run: |
          npm audit --omit=dev --prefix frontend --audit-level=critical
          npm audit --omit=dev --prefix backend --audit-level=critical

      - name: Deploy to Oracle VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/pixnette
            git pull origin main
            sudo docker compose up --build -d
            sudo docker compose exec -T backend1 node setup-db.js
